name: labels

# Crée ou met à jour les étiquettes décrites dans .github/labels.json.
on:
  push:
    branches: [main]
    paths: ['.github/labels.json', '.github/workflows/labels.yml']
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const labels = JSON.parse(fs.readFileSync('.github/labels.json', 'utf8'));
            for (const l of labels) {
              try {
                await github.rest.issues.updateLabel({ ...context.repo, name: l.name, color: l.color, description: l.description });
                core.info(`updated ${l.name}`);
              } catch (e) {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel({ ...context.repo, name: l.name, color: l.color, description: l.description });
                core.info(`created ${l.name}`);
              }
            }
