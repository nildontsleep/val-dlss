name: cleanup-branches

# Maintenance manuelle : supprime les branches déjà fusionnées dans main.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branches = ['claude/video-editor-style', 'claude/advanced-preview-i18n', 'claude/valorant-dlss-app'];
            for (const b of branches) {
              try {
                const cmp = await github.rest.repos.compareCommits({ owner, repo, base: 'main', head: b });
                if (cmp.data.ahead_by !== 0) {
                  core.warning(`${b} has ${cmp.data.ahead_by} commit(s) that are not in main: skipped`);
                  continue;
                }
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${b}` });
                core.info(`deleted ${b}`);
              } catch (e) {
                if (e.status === 404 || e.status === 422) core.info(`${b}: not found`);
                else throw e;
              }
            }
