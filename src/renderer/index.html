<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06070a">
  <title>Valorant DLSS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="vignette"></div>
  <div class="grain"></div>

  <div id="loader" aria-hidden="true">
    <div class="shutter top"></div>
    <div class="shutter bot"></div>
    <div class="ld-inner">
      <div class="ld-row"><span class="ld-rec"><i></i>REC</span><span>valorant dlss</span></div>
      <div class="ld-tc" id="ld-tc">00:00:00:00</div>
      <div class="ld-bar"><i id="ld-bar"></i></div>
    </div>
  </div>

  <div class="app" id="app">
    <header class="top">
      <nav class="nav" id="nav">
        <div class="brand"><span class="logo">V</span><span class="brand-name">Valorant <em>DLSS</em></span></div>
        <i class="sep"></i>
        <div class="seg sm" id="lang" role="radiogroup" aria-label="Language" data-i18n-tip="tip.lang">
          <span class="seg-pill"></span>
          <button role="radio" data-v="en">EN</button>
          <button role="radio" data-v="fr">FR</button>
        </div>
        <i class="sep"></i>
        <span class="rec-chip" id="rec" hidden><i></i><b id="rec-tc">00:00:00:00</b></span>
        <button class="status" id="status" data-i18n-tip="tip.status"><i></i><span data-i18n="status.missing"></span></button>
        <button class="icon" id="btn-info" data-i18n-tip="tip.info" data-i18n-aria="tip.info">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
        </button>
      </nav>
    </header>

    <main class="stage" id="stage">
      <section class="drop spot" id="drop" tabindex="0" role="button" data-i18n-aria="drop.title">
        <div class="vf" aria-hidden="true">
          <div class="thirds"></div>
          <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
          <span class="cross"></span>
          <div class="lbl tl"><span class="rec"><i></i><b id="vf-state">STANDBY</b></span><span id="vf-tc">00:00:00:00</span></div>
          <div class="lbl tr"><span id="vf-info">STYLE 2 · 1.00</span></div>
          <div class="lbl bl"><span class="meter"><b></b><b></b><b></b><b></b></span><span id="vf-count">0 clips</span></div>
          <div class="lbl br"><span id="vf-local">100% local</span></div>
        </div>
        <div class="orbit">
          <svg class="badge-spin" viewBox="0 0 170 170" aria-hidden="true">
            <defs><path id="circ" d="M 85,85 m -68,0 a 68,68 0 1,1 136,0 a 68,68 0 1,1 -136,0"/></defs>
            <text><textPath href="#circ">Neural rendering • 100% local • no upload • RTX •</textPath></text>
          </svg>
          <span class="ring r2"></span>
          <div class="drop-core">
            <svg viewBox="0 0 24 24"><path d="M12 16V5M7.5 9.5 12 5l4.5 4.5M5 19h14"/></svg>
          </div>
        </div>
        <p class="drop-title" id="drop-title" data-i18n-html="drop.title"></p>
        <p class="drop-sub" data-i18n="drop.sub"></p>
      </section>
      <ul class="queue" id="queue" aria-live="polite"></ul>
      <button class="ghost sm clear" id="btn-clear" data-i18n="clear" hidden></button>

      <section class="preview" id="preview" hidden>
        <div class="pv-bar">
          <button class="ghost" id="pv-back">
            <svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg><span data-i18n="preview.back"></span>
          </button>
          <div class="pv-clip">
            <button class="icon sm" id="pv-prev" data-i18n-tip="tip.prev" data-i18n-aria="tip.prev"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
            <span id="pv-name"></span>
            <button class="icon sm" id="pv-next" data-i18n-tip="tip.next" data-i18n-aria="tip.next"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
          </div>
        </div>
        <div class="cmp" id="cmp">
          <img id="cmp-before" alt="">
          <img id="cmp-after" alt="">
          <span class="cmp-tag l" data-i18n="preview.original"></span>
          <span class="cmp-tag r" data-i18n="preview.result"></span>
          <div class="cmp-handle" id="cmp-handle" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><i></i></div>
          <div class="cmp-load" id="cmp-load"><i class="spin"></i><span data-i18n="preview.loading"></span></div>
          <p class="cmp-err" id="cmp-err" hidden></p>
        </div>
        <div class="pv-time">
          <span id="pv-t">0:00</span>
          <input type="range" id="pv-slider" min="0" max="1" step="0.1" value="0" data-i18n-tip="tip.time" data-i18n-aria="tip.time">
          <span id="pv-d">0:00</span>
        </div>
        <p class="pv-note" data-i18n="preview.note"></p>
      </section>
    </main>

    <div class="dockwrap">
      <div class="adv" id="adv" aria-hidden="true">
        <div class="adv-inner">
          <div class="adv-presets" data-i18n-tip="tip.preset">
            <span data-i18n="adv.preset"></span>
            <select id="preset-sel"></select>
            <button class="ghost sm" id="preset-save" data-i18n="adv.save"></button>
            <button class="ghost sm" id="preset-del" data-i18n="adv.delete" hidden></button>
            <form id="preset-form" hidden>
              <input id="preset-name" maxlength="40" autocomplete="off" data-i18n-ph="adv.name">
              <button class="ghost sm" data-i18n="adv.ok"></button>
            </form>
          </div>
          <div class="adv-grid">
            <label class="field" data-i18n-tip="tip.tone">
              <span data-i18n="adv.tone"></span><input type="range" id="tone" min="0" max="1" step="0.05"><output></output>
            </label>
            <label class="field" data-i18n-tip="tip.structure">
              <span data-i18n="adv.structure"></span><input type="range" id="structure" min="0" max="1" step="0.05"><output></output>
            </label>
            <label class="field" data-i18n-tip="tip.skin">
              <span data-i18n="adv.skin"></span><input type="range" id="skin" min="0" max="1" step="0.05"><output></output>
            </label>
            <div class="field" data-i18n-tip="tip.passes">
              <span data-i18n="adv.passes"></span>
              <div class="seg sm" id="passes" role="radiogroup"><span class="seg-pill"></span><button role="radio" data-v="1">1</button><button role="radio" data-v="2">2</button><button role="radio" data-v="3">3</button></div>
            </div>
            <div class="field" data-i18n-tip="tip.quality">
              <span data-i18n="adv.quality"></span>
              <div class="seg sm" id="quality" role="radiogroup">
                <span class="seg-pill"></span>
                <button role="radio" data-v="auto" data-i18n="q.auto"></button>
                <button role="radio" data-v="good" data-i18n="q.good"></button>
                <button role="radio" data-v="best" data-i18n="q.best"></button>
                <button role="radio" data-v="max" data-i18n="q.max"></button>
              </div>
            </div>
            <label class="switch" data-i18n-tip="tip.mask">
              <input type="checkbox" id="automask"><i></i><span data-i18n="adv.mask"></span>
            </label>
          </div>
        </div>
      </div>

      <footer class="dock">
        <div class="seg" id="style" role="radiogroup" aria-label="Style" data-i18n-tip="tip.style">
          <span class="seg-pill"></span>
          <button role="radio" data-v="0">0</button>
          <button role="radio" data-v="1">1</button>
          <button role="radio" data-v="2">2</button>
        </div>
        <label class="field grow" data-i18n-tip="tip.strength">
          <span data-i18n="strength"></span><input type="range" id="strength" min="0" max="2" step="0.05"><output></output>
        </label>
        <label class="switch" data-i18n-tip="tip.compare">
          <input type="checkbox" id="compare"><i></i><span data-i18n="compare"></span>
        </label>
        <label class="switch" data-i18n-tip="tip.tiktok">
          <input type="checkbox" id="tiktok"><i></i><span data-i18n="tiktok"></span>
        </label>
        <button class="icon" id="btn-preview" data-i18n-tip="tip.preview" data-i18n-aria="tip.preview">
          <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button class="icon" id="btn-adv" data-i18n-tip="tip.advanced" data-i18n-aria="tip.advanced">
          <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
          <b class="dot"></b>
        </button>
        <button class="chip" id="btn-out" data-i18n-tip="tip.out">
          <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span id="out-name">Valorant DLSS</span>
        </button>
        <button class="primary" id="btn-run" data-i18n="run"></button>
      </footer>
    </div>
  </div>

  <div class="modal" id="modal-engine" hidden>
    <div class="card">
      <h3 data-i18n="modal.engine.title"></h3>
      <p data-i18n="modal.engine.text"></p>
      <div class="card-actions">
        <button class="ghost" data-link="engine" data-i18n="modal.engine.download"></button>
        <button class="primary" data-pick="engine" data-i18n="modal.engine.pick"></button>
      </div>
    </div>
  </div>

  <div class="modal" id="modal-ffmpeg" hidden>
    <div class="card">
      <h3 data-i18n="modal.ffmpeg.title"></h3>
      <p data-i18n-html="modal.ffmpeg.text"></p>
      <div class="card-actions">
        <button class="ghost" id="m-notiktok" data-i18n="modal.ffmpeg.skip"></button>
        <button class="ghost" data-link="ffmpeg" data-i18n="modal.engine.download"></button>
        <button class="primary" data-pick="ffmpeg" data-i18n="modal.ffmpeg.pick"></button>
      </div>
    </div>
  </div>

  <div class="modal" id="modal-info" hidden>
    <div class="card">
      <h3>valorant dlss</h3>
      <p data-i18n-html="about.credits"></p>
      <div class="paths">
        <div><span data-i18n="about.engine"></span><code id="p-engine">—</code><button class="ghost sm" data-pick="engine" data-i18n="about.change"></button></div>
        <div><span>ffmpeg</span><code id="p-ffmpeg">—</code><button class="ghost sm" data-pick="ffmpeg" data-i18n="about.change"></button></div>
      </div>
      <p class="small" data-i18n="about.disclaimer"></p>
      <div class="card-actions"><button class="primary" id="m-close" data-i18n="close"></button></div>
    </div>
  </div>

  <div class="tip" id="tip" role="tooltip"></div>
  <div class="toast" id="toast" role="status"></div>

  <script src="vendor/gsap.min.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
